name: imurbiny
description: "I'm ur Biny - AI Waste Sorting Interactive Display"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  camera: ^0.11.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  tflite_flutter: ^0.11.0
  image: ^4.0.0
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.2.1
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  crypto: ^3.0.0
  flutter_blue_plus: ^1.34.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/page_1/
    - assets/images/page_2/
    - assets/images/page_3/
    - assets/images/page_4/
    - assets/images/page_5/
    - assets/images/page_6/
    - assets/images/feedback/
    - assets/icons/
    - assets/models/waste_classifier.tflite
    - assets/models/rtdetr_best_fp32.tflite
    - .env
